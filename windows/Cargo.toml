[package]
name = "ultra"
version = "0.2.0"
edition = "2021"
description = "ULTRA — a minimalist, tiling, memory-frugal browser"

[dependencies]
wry = { version = "0.57.0", features = ["devtools"] }
tao = "0.37.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Security", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Registry", "Win32_Security_Cryptography", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader"] }
sha2 = "0.10"
# Private-workspace password hashing (Argon2id).
argon2 = "0.5"
# Reading other browsers' history for import (SQLite compiled in, no system library needed).
rusqlite = { version = "0.32", features = ["bundled"] }
# ULTRA ID: a key pair made on this computer (it will sign in to friends/chat without a password).
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# Friends & chat: the server connection, and end-to-end encryption of messages.
tungstenite = { version = "0.24", features = ["native-tls"] }
chacha20poly1305 = "0.10"
# Ad and tracker blocking: Brave's filter engine (EasyList, EasyPrivacy, uBlock lists). Built
# multi-threaded so the engine can be prepared off the UI thread.
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
# Unpacks the filter lists bundled in the exe.
miniz_oxide = "0.8"

[build-dependencies]
miniz_oxide = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
# Line tables go to the separate .pdb (the exe stays the same size), so crash.log can name the
# file and line of a crash on a computer that has the .pdb.
debug = "line-tables-only"
strip = "none"
