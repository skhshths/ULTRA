# Experimental builds. Windows is built on every push to main. The Mac build costs ten times
# the Actions minutes in a private repo, so it only runs for a batch of changes worth shipping:
# a commit message containing [mac], or a manual run with "build mac" ticked. Otherwise the
# release keeps the previous Mac download.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mac:
        description: Build the Mac app too
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - run: cargo build --release
      - run: copy target\release\ultra.exe ..\ULTRA-windows-x64.exe
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ULTRA-windows-x64.exe

  macos:
    if: ${{ inputs.mac || contains(github.event.head_commit.message, '[mac]') }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mac
      - run: sh tools/bundle.sh universal
      - run: ditto -c -k --keepParent target/ULTRA.app ../ULTRA-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ULTRA-macos.zip

  release:
    needs: [windows, macos]
    # Runs when the Mac build was skipped too; never ships a half-failed build.
    if: ${{ always() && needs.windows.result == 'success' && needs.macos.result != 'failure' && needs.macos.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Replace the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # No new Mac build this time: carry the previous one over.
          if [ ! -f ULTRA-macos.zip ]; then
            gh release download latest -p ULTRA-macos.zip || true
          fi
          files="ULTRA-windows-x64.exe"
          [ -f ULTRA-macos.zip ] && files="$files ULTRA-macos.zip"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest $files \
            --title "ULTRA experimental (latest build)" \
            --target "$GITHUB_SHA" \
            --latest \
            --notes "Newest build of ULTRA, from commit ${GITHUB_SHA::7}.

          - **Windows 10/11:** download \`ULTRA-windows-x64.exe\` and run it. If SmartScreen appears, click *More info → Run anyway*.
          - **macOS 11+ (early preview):** download \`ULTRA-macos.zip\`, drag ULTRA.app to Applications, then right-click → Open the first time.

          Experimental build: for invited testers only. See the README for help getting started."
