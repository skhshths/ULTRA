# Experimental builds. Every push to main is a new release named after a food in alphabetical
# order, like the public ones but marked experimental (ULTRA Experimental 1 · Apple, 2 · Banana…),
# and it becomes GitHub's "latest" release, which ULTRA's "check for updates" installs.
# Windows is built on every push. The Mac build costs ten times the Actions minutes in a private
# repo, so it only runs for a batch of changes worth shipping: a commit message containing
# [mac], or a manual run with "build mac" ticked. Otherwise the release carries over the
# previous Mac download.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mac:
        description: Build the Mac app too
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  name:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      title: ${{ steps.pick.outputs.title }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          foods=(Apple Banana Cherry Dumpling Eclair Fig Gelato Honeydew Icecream Jalapeno Kiwi Lemon Mango
                 Nectarine Olive Pancake Quiche Ramen Sushi Taco Udon Vanilla Waffle Xigua Yam Ziti)
          # Releases so far are tagged v<number>-<food>; the next number is one more.
          last=$(gh release list --limit 1000 --json tagName --jq '.[].tagName' | sed -n 's/^v\([0-9]\+\)-.*/\1/p' | sort -n | tail -1)
          n=$(( ${last:-0} + 1 ))
          food=${foods[$(( (n - 1) % 26 ))]}
          round=$(( (n - 1) / 26 + 1 ))
          [ "$round" -gt 1 ] && food="$food $round"
          slug=$(echo "$food" | tr 'A-Z ' 'a-z-')
          echo "tag=v$n-$slug" >> "$GITHUB_OUTPUT"
          echo "title=ULTRA Experimental $n · $food" >> "$GITHUB_OUTPUT"

  windows:
    needs: name
    runs-on: windows-latest
    env:
      ULTRA_RELEASE: ${{ needs.name.outputs.title }}
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - run: cargo build --release
      - run: copy target\release\ultra-exp.exe ..\ULTRA-windows-x64.exe
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ULTRA-windows-x64.exe

  macos:
    needs: name
    if: ${{ inputs.mac || contains(github.event.head_commit.message, '[mac]') }}
    runs-on: macos-latest
    env:
      ULTRA_RELEASE: ${{ needs.name.outputs.title }}
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mac
      - run: sh tools/bundle.sh universal
      - run: ditto -c -k --keepParent target/*.app ../ULTRA-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ULTRA-macos.zip

  release:
    needs: [name, windows, macos]
    # Runs when the Mac build was skipped too; never ships a half-failed build.
    if: ${{ always() && needs.name.result == 'success' && needs.windows.result == 'success' && needs.macos.result != 'failure' && needs.macos.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.name.outputs.tag }}
          TITLE: ${{ needs.name.outputs.title }}
        run: |
          # No new Mac build this time: carry the newest one over.
          if [ ! -f ULTRA-macos.zip ]; then
            gh release download -p ULTRA-macos.zip || true
          fi
          files="ULTRA-windows-x64.exe"
          [ -f ULTRA-macos.zip ] && files="$files ULTRA-macos.zip"
          # The old rolling "latest" release (from before releases had names) goes away.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" $files \
            --title "$TITLE" \
            --target "$GITHUB_SHA" \
            --latest \
            --notes "**$TITLE**, built from commit ${GITHUB_SHA::7}.

          - **Windows 10/11:** download \`ULTRA-windows-x64.exe\` and run it. If SmartScreen appears, click *More info → Run anyway*. Already using it? Settings → updates → **update now** installs it in place (connect GitHub there once).
          - **macOS 11+ (early preview):** download \`ULTRA-macos.zip\`, drag the app to Applications, then right-click → Open the first time.

          Experimental build: for invited testers only. See the README for help getting started."
